# Knowledge Services database environment registry (values: BellLabs/.secrets/<plane>-db.env with the KS_ prefix).
# Scope: database variables, the application selector and the release-check mode. The ONLY reader is
# packages/host/src/config/database.ts (loadKsDatabaseConfig);
# `readers` lists where the resolved value is consumed. Checked by packages/host/src/config/database.test.ts.
# Plane = application of the binding/operation or KS_APPLICATION: ai-engineer -> AIENG, biotech -> BIOTECH;
# no application -> AIENG restricted to loopback values (a remote value is refused, SPEC-03 K3).
entries:
  - name: KS_AIENG_DB_PROJECT_REF
    description: "Supabase project ref of the plane. When set, it must appear in the host or user of every sibling URL/DSN (startup check); unset skips the check (disposable loopback database)."
    kind: ref
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - startup check only
  - name: KS_AIENG_DB_URL
    description: "Supabase project URL (private Storage endpoint for source captures, derivatives and ledger artifacts)."
    kind: url
    secret: false
    plane: AIENG
    role: URL
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - apps/verification-executor/src/knowledge/context.ts:115
      - packages/host/src/server/worker.ts:127
      - packages/host/src/server/knowledge.ts:26
      - packages/host/src/verification/api/verification-benchmark-comparison-reads-runtime.ts:26
      - packages/host/src/verification/api/verification-benchmark-reads-runtime.ts:28
      - packages/host/src/verification/api/verification-capture-reads-runtime.ts:24
      - packages/host/src/verification/api/verification-provider-reconciliation-runtime.ts:48
      - packages/host/src/verification/api/verification-structured-extraction-reads-runtime.ts:21
  - name: KS_AIENG_DB_SECRET_KEY
    description: "Supabase secret (service) key for Storage. The earlier service-role alias is deleted."
    kind: secret
    secret: true
    plane: AIENG
    role: SECRET_KEY
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - apps/verification-executor/src/knowledge/context.ts:115
      - packages/host/src/server/worker.ts:127
      - packages/host/src/server/knowledge.ts:26
      - packages/host/src/verification/api/verification-benchmark-comparison-reads-runtime.ts:26
      - packages/host/src/verification/api/verification-benchmark-reads-runtime.ts:28
      - packages/host/src/verification/api/verification-capture-reads-runtime.ts:24
      - packages/host/src/verification/api/verification-provider-reconciliation-runtime.ts:48
      - packages/host/src/verification/api/verification-structured-extraction-reads-runtime.ts:21
  - name: KS_AIENG_DB_ADMIN_DSN
    description: "Schema-owner / installer login. Read by the disposable-database integration tests, the Sprint V proof script, the jev course scripts and CI; no deployed process reads it."
    kind: dsn
    secret: true
    plane: AIENG
    role: ADMIN_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - scripts/experiments/sprint-v/run.ts:116
      - scripts/experiments/jev/local/apply-course-tracks.mjs:49
      - scripts/experiments/jev/local/classify-video-tracks.mjs:226
      - packages/knowledge-db-contract/src/installer.integration.test.ts:11
      - .github/workflows/verify.yml:24
      - turbo.json:15
  - name: KS_AIENG_DB_RUNTIME_DSN
    description: "Canonical runtime pool login for API, MCP, worker and the knowledge executor. Whatever restricted or temporary login the process is given (privilege split is out of scope)."
    kind: dsn
    secret: true
    plane: AIENG
    role: RUNTIME_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - packages/host/src/server/api.ts:60
      - packages/host/src/server/mcp.ts:55
      - packages/host/src/server/worker.ts:127
      - apps/verification-executor/src/knowledge/context.ts:115
      - fixtures/openai-pre-mc/capture-primary-sources.ts:55
  - name: KS_AIENG_DB_COMPONENT_DSN
    description: "Binding component database login; named by a binding's `databaseUrlEnv` in KS_KNOWLEDGE_BINDINGS_JSON and by `knowledge-verify grant-reviewer --database-url-env`."
    kind: dsn
    secret: true
    plane: AIENG
    role: COMPONENT_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - packages/host/src/knowledge-operation/backends.ts:99
      - apps/verification-executor/src/reviewer-grant.ts:152
  - name: KS_BIOTECH_DB_PROJECT_REF
    description: "Supabase project ref of the plane. When set, it must appear in the host or user of every sibling URL/DSN (startup check); unset skips the check (disposable loopback database)."
    kind: ref
    secret: false
    plane: BIOTECH
    role: PROJECT_REF
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
  - name: KS_BIOTECH_DB_URL
    description: "Supabase project URL (private Storage endpoint for source captures, derivatives and ledger artifacts)."
    kind: url
    secret: false
    plane: BIOTECH
    role: URL
    status: "defined (read only for a process started with application biotech; no Knowledge Services entrypoint selects it today)"
    readers:
      - packages/host/src/config/database.ts:176
  - name: KS_BIOTECH_DB_SECRET_KEY
    description: "Supabase secret (service) key for Storage. The earlier service-role alias is deleted."
    kind: secret
    secret: true
    plane: BIOTECH
    role: SECRET_KEY
    status: "defined (read only for a process started with application biotech; no Knowledge Services entrypoint selects it today)"
    readers:
      - packages/host/src/config/database.ts:176
  - name: KS_BIOTECH_DB_ADMIN_DSN
    description: "Schema-owner / installer login. Read by the disposable-database integration tests, the Sprint V proof script, the jev course scripts and CI; no deployed process reads it."
    kind: dsn
    secret: true
    plane: BIOTECH
    role: ADMIN_DSN
    status: "defined (read only for a process started with application biotech; no Knowledge Services entrypoint selects it today)"
    readers:
      - packages/host/src/config/database.ts:176
  - name: KS_BIOTECH_DB_RUNTIME_DSN
    description: "Canonical runtime pool login for API, MCP, worker and the knowledge executor. Whatever restricted or temporary login the process is given (privilege split is out of scope)."
    kind: dsn
    secret: true
    plane: BIOTECH
    role: RUNTIME_DSN
    status: "defined (read only for a process started with application biotech; no Knowledge Services entrypoint selects it today)"
    readers:
      - packages/host/src/config/database.ts:176
  - name: KS_BIOTECH_DB_COMPONENT_DSN
    description: "Binding component database login; named by a binding's `databaseUrlEnv` in KS_KNOWLEDGE_BINDINGS_JSON and by `knowledge-verify grant-reviewer --database-url-env`."
    kind: dsn
    secret: true
    plane: BIOTECH
    role: COMPONENT_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - packages/host/src/knowledge-operation/backends.ts:99
      - apps/verification-executor/src/reviewer-grant.ts:152
  - name: KS_APPLICATION
    description: "Names the process's application (ai-engineer or biotech) and so the plane it may reach remotely. Unset (the default): the AIENG plane, loopback only; a remote URL/DSN is refused KS_DB_REMOTE_REQUIRES_APPLICATION."
    kind: selector
    secret: false
    plane: ANY
    role: APPLICATION
    status: "active"
    readers:
      - packages/host/src/config/database.ts:176
      - infra/aws/knowledge-runtime.template.json (worker sets ai-engineer)
  - name: AIENG_DB_RELEASE_CHECK
    description: "How a process checks the release of the AI Engineer database before it starts (VER-S1, D-117): enforce (the default) refuses to start unless api.database_release() states a release in this service's range (the version of the vendored @aiengineer/database-contract); warn always starts and logs the verdict; off does not ask the database. Any other word, an empty value included, is refused at load. The name is the contract's, shared with the AI Engineer service and Mission Control, so it has no KS_ prefix. AIENG plane only; the Biotech database is never asked."
    kind: mode
    secret: false
    plane: AIENG
    role: RELEASE_CHECK
    status: "active"
    readers:
      - packages/host/src/config/database.ts (loadKsDatabaseConfig, through checkMode in packages/persistence/src/database-release.ts)
      - packages/host/src/config/database-release.ts (startOnAiEngineerDatabase, startOnAiEngineerDatabaseAt)
      - packages/host/src/server/api.ts, mcp.ts, worker.ts
      - packages/host/src/knowledge-operation/config.ts (a binding on KS_AIENG_DB_COMPONENT_DSN)
      - apps/verification-executor/src/knowledge/context.ts (openKnowledgeServices)
      - apps/verification-executor/src/reviewer-grant.ts
