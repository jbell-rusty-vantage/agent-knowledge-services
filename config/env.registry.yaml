# Knowledge Services database environment registry (values: BellLabs/.secrets/<plane>-db.env with the KS_ prefix).
# Scope: database variables only. The ONLY reader is packages/host/src/config/database.ts (line 136);
# `readers` lists where the resolved value is consumed. Checked by packages/host/src/config/database.test.ts.
# Plane = application of the binding/operation: ai-engineer -> AIENG, biotech -> BIOTECH; no application -> AIENG.
entries:
  - name: KS_AIENG_DB_PROJECT_REF
    description: "Supabase project ref of the plane. When set, it must appear in the host or user of every sibling URL/DSN (startup check); unset skips the check (disposable loopback database)."
    kind: ref
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - startup check only
  - name: KS_AIENG_DB_URL
    description: "Supabase project URL (private Storage endpoint for source captures, derivatives and ledger artifacts)."
    kind: url
    secret: false
    plane: AIENG
    role: URL
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - apps/verification-executor/src/knowledge/context.ts:90
      - packages/host/src/server/worker.ts:124
      - packages/host/src/server/knowledge.ts:26
      - packages/host/src/verification/api/verification-benchmark-comparison-reads-runtime.ts:26
      - packages/host/src/verification/api/verification-benchmark-reads-runtime.ts:28
      - packages/host/src/verification/api/verification-capture-reads-runtime.ts:24
      - packages/host/src/verification/api/verification-provider-reconciliation-runtime.ts:48
      - packages/host/src/verification/api/verification-structured-extraction-reads-runtime.ts:21
  - name: KS_AIENG_DB_SECRET_KEY
    description: "Supabase secret (service) key for Storage. The earlier service-role alias is deleted."
    kind: secret
    secret: true
    plane: AIENG
    role: SECRET_KEY
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - apps/verification-executor/src/knowledge/context.ts:90
      - packages/host/src/server/worker.ts:124
      - packages/host/src/server/knowledge.ts:26
      - packages/host/src/verification/api/verification-benchmark-comparison-reads-runtime.ts:26
      - packages/host/src/verification/api/verification-benchmark-reads-runtime.ts:28
      - packages/host/src/verification/api/verification-capture-reads-runtime.ts:24
      - packages/host/src/verification/api/verification-provider-reconciliation-runtime.ts:48
      - packages/host/src/verification/api/verification-structured-extraction-reads-runtime.ts:21
  - name: KS_AIENG_DB_ADMIN_DSN
    description: "Schema-owner / installer login. Read by the disposable-database integration tests, the Sprint V proof script, the jev course scripts and CI; no deployed process reads it."
    kind: dsn
    secret: true
    plane: AIENG
    role: ADMIN_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - scripts/experiments/sprint-v/run.ts:116
      - scripts/experiments/jev/local/apply-course-tracks.mjs:49
      - scripts/experiments/jev/local/classify-video-tracks.mjs:226
      - packages/knowledge-db-contract/src/installer.integration.test.ts:11
      - .github/workflows/verify.yml:24
      - turbo.json:15
  - name: KS_AIENG_DB_RUNTIME_DSN
    description: "Canonical runtime pool login for API, MCP, worker and the knowledge executor. Whatever restricted or temporary login the process is given (privilege split is out of scope)."
    kind: dsn
    secret: true
    plane: AIENG
    role: RUNTIME_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - packages/host/src/server/api.ts:55
      - packages/host/src/server/mcp.ts:49
      - packages/host/src/server/worker.ts:124
      - apps/verification-executor/src/knowledge/context.ts:90
      - fixtures/openai-pre-mc/capture-primary-sources.ts:55
  - name: KS_AIENG_DB_COMPONENT_DSN
    description: "Binding component database login; named by a binding's `databaseUrlEnv` in KS_KNOWLEDGE_BINDINGS_JSON and by `knowledge-verify grant-reviewer --database-url-env`."
    kind: dsn
    secret: true
    plane: AIENG
    role: COMPONENT_DSN
    status: "active"
    readers:
      - packages/host/src/config/database.ts:136
      - packages/host/src/knowledge-operation/backends.ts:99
      - apps/verification-executor/src/reviewer-grant.ts:141
  - name: KS_BIOTECH_DB_PROJECT_REF
    description: "Supabase project ref of the plane. When set, it must appear in the host or user of every sibling URL/DSN (startup check); unset skips the check (disposable loopback database)."
    kind: ref
    secret: false
    plane: BIOTECH
    role: PROJECT_REF
