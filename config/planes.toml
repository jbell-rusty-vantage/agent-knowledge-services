# Data-plane registry: identities only, never credentials (SPEC-03 K3; design DATA-ACCESS §5).
#
# Read by scripts/dev/planes.py (`./dev planes list|show|check`, `./dev db status|schema|query`).
# Every fact here is public: project refs, hosts, ports, container names and the NAMES of the
# variables that hold credentials. Values live in <workspace>/.secrets/<file>.env, in a repository
# file named below, or in a local container's environment, and are resolved inside the process at
# run time. `./dev planes check` fails when a value-shaped string appears in this file.
#
# Postures: disposable (may be wiped by an accepted packet) · protected (holds data that cannot be
# recreated: writes refused) · protected-local (a local lab that holds checkpoints: writes need
# --write --confirm <container>) · retired (refused by every access command).
# A fact marked `verified = false` was not checked against the live plane when this file was
# written; `sources` names where each plane's facts come from (paths relative to the workspace).
# Copied from Mission Control's config/planes.toml (31970844), keeping only the planes Knowledge
# Services reaches. Mission Control's file stays the full registry; a fact changed there is changed here.

[registry]
format_version = 1
# The BellLabs workspace root, relative to the repository root (the folder holding `.secrets/`).
workspace = "../.."
# One line per remote call; never values or result rows.
audit_log = ".scratch/planes/audit.jsonl"
# Where schema changes go; `./dev db` refuses DDL everywhere and names this.
installer = "the owning contract's installer: scripts/install-ai-engineer.mjs in aiengineer/ai-engineer-db-contract (AI Engineer), the Biotech contract's installer (Biotech); Knowledge Services' own component through its release path"
statement_timeout_ms = 10000
connect_timeout_s = 10
row_limit = 200

# Tables whose newest row `./dev db status` reports when they exist (migration heads).
[[registry.heads]]
name = "knowledge-services verification component"
table = "knowledge_verification.component_release"
column = "component_version"
order_by = "applied_at"

[[registry.heads]]
name = "supabase migrations"
table = "supabase_migrations.schema_migrations"
column = "version"
order_by = "version"

