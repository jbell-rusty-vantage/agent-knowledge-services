packages:
  - "apps/*"
  - "packages/*"
  - "packages/bindings/*"

onlyBuiltDependencies:
  - esbuild

catalog:
  "@modelcontextprotocol/sdk": 1.30.0
  "@types/node": 26.4.0
  fastify: 5.12.1
  tsup: 8.5.1
  tsx: 4.23.13
  turbo: 2.10.12
  typescript: 7.0.2
  vitest: 4.1.11
  zod: 4.5.4

allowBuilds:
  esbuild: set this to true or false

# dependency-cruiser reads TypeScript sources through the `typescript` compiler API, which the workspace's TypeScript 7 does
# not publish yet. Give only dependency-cruiser its own supported compiler; no workspace package resolves this copy.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: npm:typescript@6.0.3
